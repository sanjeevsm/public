{% extends "base.html" %}
{% block title %}iCare+ — Specialities{% endblock %}
{% block content %}
<div class="page-head"><div class="page-head-text"><h1>Specialities</h1><p>Medical specialities offered.</p></div></div>
<div class="container">
  <ul id="specList"></ul>
</div>
{% endblock %}
{% block scripts %}
<script>
fetch('{{ api_url }}/specialities').then(r=>r.json()).then(data=>{
  const ul = document.getElementById('specList');
  data.forEach(s=>{ const li=document.createElement('li'); li.textContent = s.name; ul.appendChild(li); });
})
</script>
{% endblock %}
