<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{% block title %}iCare+{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Tailwind theme variables and a simple theme toggle using localStorage
      if (!localStorage.getItem('icare:theme')) localStorage.setItem('icare:theme','light');
      const theme = localStorage.getItem('icare:theme');
      if (theme === 'dark') document.documentElement.classList.add('dark');
      function toggleTheme(){
        if (document.documentElement.classList.contains('dark')){ document.documentElement.classList.remove('dark'); localStorage.setItem('icare:theme','light'); }
        else { document.documentElement.classList.add('dark'); localStorage.setItem('icare:theme','dark'); }
      }
    </script>
    <style>
      :root{--brand:#2563eb}
    </style>
</head>
<body>
    <body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen">
    <header class="bg-white dark:bg-slate-800 shadow-sm">
      <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="text-2xl font-semibold text-sky-600">iCare+</div>
          <nav class="space-x-3 text-sm">
            <a class="text-slate-600 hover:text-slate-900" href="/">Home</a>
            <a class="text-slate-600 hover:text-slate-900" href="/specialities">Specialities</a>
            <a class="text-slate-600 hover:text-slate-900" href="/patients">Patients</a>
            <a class="text-slate-600 hover:text-slate-900" href="/appointments">Appointments</a>
          </nav>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="toggleTheme()" class="px-3 py-1 bg-slate-100 dark:bg-slate-700 rounded">Toggle theme</button>
        </div>
      </div>
    </header>
    <main class="max-w-6xl mx-auto p-6">{% block content %}{% endblock %}</main>
    {% block scripts %}{% endblock %}
  </body>
</body>
{% block scripts %}{% endblock %}
</html>
</html>
