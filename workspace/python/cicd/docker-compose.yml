version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# CI/CD Dashboard — standalone Docker Compose
#
# Quick start:
#   cp .env.example .env        # review defaults; no changes needed for local use
#   docker compose up -d
#
# Access:  http://localhost:8000  (or replace localhost with the host's LAN IP)
#
# LAN access: the server binds to 0.0.0.0 — all other machines on the same
# network can reach it at  http://<host-ip>:8000  without any config change.
# ─────────────────────────────────────────────────────────────────────────────

services:
  cicd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cicd
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CACHE_TTL: ${CACHE_TTL:-60}
    env_file:
      - path: .env
        required: false
