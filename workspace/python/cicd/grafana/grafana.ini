[server]
root_url = http://localhost:${GRAFANA_PORT}

[security]
allow_embedding = true
cookie_samesite = none
cookie_secure = false

[auth.anonymous]
enabled = false

[users]
allow_sign_up = false

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/cicd-dashboard.json

[log]
mode = console
level = warn

[analytics]
reporting_enabled = false
check_for_updates = false

[feature_toggles]
enable = publicDashboards
