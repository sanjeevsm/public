<!DOCTYPE html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}iLab+{% endblock %} | AI Interview Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">
      <span class="brand-logo">iLab<span class="brand-plus">+</span></span>
      <span class="brand-sub">AI Interview Simulator</span>
    </div>
    <div class="navbar-actions">
      {% block nav_actions %}{% endblock %}
      <a href="{{ url_for('main.settings_page') }}" class="btn btn-ghost" title="Settings">
        ⚙️ Settings
      </a>
    </div>
  </nav>
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
