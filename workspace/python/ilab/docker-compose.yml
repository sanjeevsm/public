version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# iLab+ — AI Interview Simulator — standalone Docker Compose
#
# Quick start:
#   cp .env.example .env        # set ILAB_SECRET to a random string
#   docker compose up -d
#
# Access:  http://localhost:8001  (or replace localhost with the host's LAN IP)
#
# LAN access: the server binds to 0.0.0.0 — other machines on the same network
# can reach it at  http://<host-ip>:8001  without any config change.
#
# API keys (Claude, OpenAI, etc.) are entered in the browser and stored in
# localStorage — they are never configured on the server.
#
# NOTE: uses a single Gunicorn worker (-w 1). Do not increase workers —
# quiz and session state is in-memory and will silently break with multiple workers.
# ─────────────────────────────────────────────────────────────────────────────

services:
  ilab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ilab
    restart: unless-stopped
    ports:
      - "${PORT:-8001}:8001"
    environment:
      HOST: "0.0.0.0"
      PORT: "8001"
      FLASK_DEBUG: "0"
      ILAB_SECRET: ${ILAB_SECRET:-change-me-to-a-random-hex-string}
    env_file:
      - path: .env
        required: false
